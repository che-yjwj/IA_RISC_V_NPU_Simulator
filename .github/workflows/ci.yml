name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  unit:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia_risc_v_npu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ia_risc_v_npu/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run pytest (unit + integration)
        id: pytest_unit
        run: python -m scripts.deterministic_env -- pytest -q --json-report --json-report-file=reports/unit-report.json
        continue-on-error: true

      - name: Upload unit test report
        if: steps.pytest_unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-pytest-report
          path: ia_risc_v_npu/reports/unit-report.json

      - name: Fail job when tests fail
        if: steps.pytest_unit.outcome == 'failure'
        run: exit 1

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: ia_risc_v_npu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ia_risc_v_npu/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run pytest (performance only)
        id: pytest_performance
        run: >-
          python -m scripts.deterministic_env -- pytest tests/performance --benchmark-only
          --json-report --json-report-file=reports/performance-report.json
        continue-on-error: true

      - name: Upload performance report
        if: steps.pytest_performance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: performance-pytest-report
          path: ia_risc_v_npu/reports/performance-report.json

      - name: Fail job when benchmarks fail
        if: steps.pytest_performance.outcome == 'failure'
        run: exit 1
