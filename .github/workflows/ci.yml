name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  lint:
    name: Lint and Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ia_risc_v_npu/pyproject.toml

      - name: Install dependencies
        working-directory: ia_risc_v_npu
        run: python3 -m pip install -e .[dev]

      - name: Collect changed Python files
        id: changed-python
        run: |
          python3 <<'PY'
          import os
          import subprocess

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          diff_range: str | None = None

          if event == "pull_request":
              base_ref = os.environ.get("GITHUB_BASE_REF")
              if base_ref:
                  subprocess.run(
                      ["git", "fetch", "origin", base_ref, "--depth", "1"],
                      check=True,
                  )
                  diff_range = "FETCH_HEAD...HEAD"
          else:
              parent = subprocess.run(
                  ["git", "rev-parse", "HEAD^"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if parent.returncode == 0:
                  diff_range = f"{parent.stdout.strip()}...HEAD"

          changed = []
          if diff_range:
              result = subprocess.run(
                  ["git", "diff", "--name-only", diff_range],
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
              )
              changed = [line.strip() for line in result.stdout.splitlines() if line.strip()]

          python_files = sorted({path for path in changed if path.endswith(".py")})
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as fh:
              if python_files:
                  fh.write("python_changed=true\n")
                  fh.write("paths<<EOF\n")
                  fh.write("\n".join(python_files))
                  fh.write("\nEOF\n")
              else:
                  fh.write("python_changed=false\n")
          PY

      - name: Run black
        if: steps.changed-python.outputs.python_changed == 'true'
        run: |
          python3 <<'PY'
          import shlex
          import subprocess
          import sys

          raw = """${{ steps.changed-python.outputs.paths }}"""
          paths = [line.strip() for line in raw.splitlines() if line.strip()]
          if not paths:
              sys.exit(0)

          cmd = ["black", "--check", *paths]
          print("+", " ".join(shlex.quote(part) for part in cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Run ruff
        if: steps.changed-python.outputs.python_changed == 'true'
        run: |
          python3 <<'PY'
          import shlex
          import subprocess
          import sys

          raw = """${{ steps.changed-python.outputs.paths }}"""
          paths = [line.strip() for line in raw.splitlines() if line.strip()]
          if not paths:
              sys.exit(0)

          cmd = ["ruff", "check", *paths]
          print("+", " ".join(shlex.quote(part) for part in cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Skip lint when no Python changes
        if: steps.changed-python.outputs.python_changed != 'true'
        run: echo "No Python files changed; skipping lint."

  unit:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ia_risc_v_npu/pyproject.toml

      - name: Install dependencies (editable)
        working-directory: ia_risc_v_npu
        run: python3 -m pip install -e .[dev]

      - name: Unit smoke (editable install check)
        working-directory: ia_risc_v_npu
        run: python3 -m pytest tests/unit -vv

      - name: Prepare report directory
        working-directory: ia_risc_v_npu
        run: mkdir -p reports

      - name: Run pytest (unit + integration)
        id: pytest_unit
        working-directory: ia_risc_v_npu
        run: python3 -m scripts.deterministic_env -- pytest -v -q --json-report --json-report-file=reports/unit-report.json | tee reports/unit-pytest.log
        continue-on-error: true

      - name: Upload unit test report
        if: steps.pytest_unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-pytest-report
          path: ia_risc_v_npu/reports/unit-report.json

      - name: Upload unit test log
        if: steps.pytest_unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-pytest-log
          path: ia_risc_v_npu/reports/unit-pytest.log

      - name: Fail job when tests fail
        if: steps.pytest_unit.outcome == 'failure'
        run: exit 1

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ia_risc_v_npu/pyproject.toml

      - name: Install dependencies (editable)
        working-directory: ia_risc_v_npu
        run: python3 -m pip install -e .[dev]

      - name: Prepare report directory
        working-directory: ia_risc_v_npu
        run: mkdir -p reports

      - name: Run pytest (performance only)
        id: pytest_performance
        working-directory: ia_risc_v_npu
        run: >-
          python3 -m scripts.deterministic_env -- pytest -v tests/performance --benchmark-only
          --json-report --json-report-file=reports/performance-report.json | tee reports/performance-pytest.log
        continue-on-error: true

      - name: Upload performance report
        if: steps.pytest_performance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: performance-pytest-report
          path: ia_risc_v_npu/reports/performance-report.json

      - name: Upload performance test log
        if: steps.pytest_performance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: performance-pytest-log
          path: ia_risc_v_npu/reports/performance-pytest.log

      - name: Fail job when benchmarks fail
        if: steps.pytest_performance.outcome == 'failure'
        run: exit 1
