[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-risc-v-npu-simulator"
version = "0.1.0"
description = "Hybrid RISC-V NPU simulator with configurable workloads."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "IA RISC-V NPU Team" }]
keywords = ["risc-v", "npu", "simulator"]
dependencies = [
    "numpy",
    "pyelftools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-json-report",
    "black",
    "ruff",
]

[tool.setuptools]
package-dir = { "" = "src", "workloads" = "workloads" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*", "scripts*", "workloads*"]
namespaces = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
