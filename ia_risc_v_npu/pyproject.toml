[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-risc-v-npu-simulator"
version = "0.1.0"
description = "Hybrid RISC-V NPU simulator with configurable workloads."
readme = { file = "../README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{ name = "IA RISC-V NPU Team" }]
keywords = ["risc-v", "npu", "simulator"]
dependencies = [
    "numpy",
    "pyelftools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-json-report",
]

[tool.setuptools]
package-dir = { "" = "src", "scripts" = "scripts" }

[tool.setuptools.packages.find]
where = ["src", "scripts"]
namespaces = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
