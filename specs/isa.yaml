version: 1
operations:
  - name: DMA_2D
    category: dma
    summary: "2D DMA transfer between memory spaces with stride support."
    operands:
      src:
        type: address
        required: true
        description: Source region handle or URI.
      dst:
        type: address
        required: true
        description: Destination region handle or URI.
      shape:
        type: int[2]
        required: true
        description: "[rows, cols] tile dimensions."
      strides:
        type: int[2]
        required: false
        description: "Optional [row_stride, col_stride] overrides."
    tags:
      - memory
      - transfer
  - name: TE_GEMM
    category: tensor_engine
    summary: "Matrix multiplication executed on the tensor engine."
    operands:
      m:
        type: int
        required: true
        description: Output rows (A x B).
      n:
        type: int
        required: true
        description: Output columns (A x B).
      k:
        type: int
        required: true
        description: Reduction dimension.
      a:
        type: address
        required: true
        description: Source buffer for matrix A.
      b:
        type: address
        required: true
        description: Source buffer for matrix B.
      c:
        type: address
        required: false
        description: Optional destination buffer override.
    tags:
      - compute
  - name: TE_CONV2D
    category: tensor_engine
    summary: "2D convolution executed via GEMM lowering on the tensor engine."
    operands:
      input:
        type: address
        required: true
        description: Source activation tensor URI.
      weights:
        type: address
        required: true
        description: Filter tensor URI.
      output:
        type: address
        required: true
        description: Destination tensor URI.
      stride:
        type: int[2]
        required: false
        description: "[stride_h, stride_w] overrides (default 1)."
      padding:
        type: int[2]
        required: false
        description: "[pad_top, pad_left] symmetric padding."
      dilation:
        type: int[2]
        required: false
        description: "[dilation_h, dilation_w] factors."
      groups:
        type: int
        required: false
        description: "Group count for grouped convolution."
    tags:
      - compute
  - name: FENCE_SPM
    category: synchronisation
    summary: "Synchronise outstanding scratchpad memory operations."
    operands: {}
    tags:
      - synchronisation
  - name: VEC_ADD
    category: vector_engine
    summary: "Elementwise vector addition executed on SIMD lanes."
    operands:
      dst:
        type: address
        required: true
        description: Destination vector buffer.
      src0:
        type: address
        required: true
        description: First source vector buffer.
      src1:
        type: address
        required: true
        description: Second source vector buffer.
      length:
        type: int
        required: true
        description: Number of elements to process.
      stride:
        type: int
        required: false
        description: Optional element stride (defaults to 1).
    tags:
      - vector
      - simd
